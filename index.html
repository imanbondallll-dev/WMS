<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>WMS Pro</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
    }

    #wmsFrame {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      margin: 0;
      padding: 0;
      display: block;
      background: #ffffff;
    }

    #loading {
      position: fixed;
      z-index: 9999;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      font-family: Arial, sans-serif;
      font-size: 16px;
      color: #333333;
    }

    #loading.hidden {
      display: none;
    }

    .loading-box {
      text-align: center;
    }

    .spinner {
      width: 40px;
      height: 40px;
      margin: 0 auto 15px;
      border: 4px solid #e5e7eb;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <!-- Loading -->
  <div id="loading">
    <div class="loading-box">
      <div class="spinner"></div>
      <div>Memuat WMS Pro...</div>
    </div>
  </div>

  <!-- WMS Google Apps Script -->
  <iframe
    id="wmsFrame"
    src="https://script.google.com/macros/s/AKfycby_vbQlfaNtuDqS5rX7-gjMudUTJaLpSpCgWMjlKdPB89TmwzobV0ANF6cBbL_wqfQm/exec"
    title="WMS Pro"
    allow="fullscreen"
    allowfullscreen>
  </iframe>

  <script>
    const wmsFrame = document.getElementById("wmsFrame");
    const loading = document.getElementById("loading");

    // Sembunyikan loading setelah WMS selesai dimuat
    wmsFrame.addEventListener("load", function () {
      setTimeout(function () {
        loading.classList.add("hidden");
      }, 500);
    });

    // Jika terjadi error
    wmsFrame.addEventListener("error", function () {
      loading.innerHTML = `
        <div class="loading-box">
          <h3>WMS gagal dimuat</h3>
          <p>
            Silakan periksa koneksi internet atau URL Google Apps Script.
          </p>
          <button
            onclick="location.reload()"
            style="
              padding:10px 20px;
              border:none;
              border-radius:6px;
              background:#2563eb;
              color:white;
              cursor:pointer;
            ">
            Muat Ulang
          </button>
        </div>
      `;
    });

    // Fullscreen hanya setelah pengguna melakukan klik.
    function masukFullscreen() {
      const frame = document.getElementById("wmsFrame");

      if (frame.requestFullscreen) {
        frame.requestFullscreen().catch(function (error) {
          console.log("Fullscreen tidak tersedia:", error);
        });
      }
    }

    // Tekan F11 untuk fullscreen browser seperti biasa.
    document.addEventListener("keydown", function (event) {
      if (event.key === "F11") {
        event.preventDefault();
      }
    });
  </script>

</body>
</html>
